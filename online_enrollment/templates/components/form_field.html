<div class="{% if field.widget_type == 'textarea' %}md:col-span-2{% endif %}">
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-ink mb-1">{{ field.label }}</label>
  {{ field }}
  {% for error in field.errors %}<p class="text-sm text-bad mt-1">{{ error }}</p>{% endfor %}
</div>
