{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto text-center bg-white rounded-2xl border border-slate-200 p-10 mt-10">
  <h1 class="text-3xl font-bold text-slate-900 mb-2">Registration received</h1>
  <p class="text-slate-600 mb-3">Your student ID is</p>
  <p class="text-4xl font-bold text-blue-900 mb-4">{{ student_id }}</p>
  <p class="text-slate-600 mb-6">
    Your enrollment is <strong>Pending</strong>. Please submit your documents to the registrar.
  </p>
  <a href="{% url 'students:register' %}" class="text-blue-900 font-medium">Register another student</a>
</div>
{% endblock %}
